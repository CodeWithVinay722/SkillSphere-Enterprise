name: Build and Push Images to ACR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/skillsphere-backend:v1 ./backend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/skillsphere-backend:v1

      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/skillsphere-frontend:v1 ./frontend

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/skillsphere-frontend:v1
