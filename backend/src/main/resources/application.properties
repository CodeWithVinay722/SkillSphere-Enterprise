spring.application.name=skillsphere-backend
server.port=8080

# =========================================================
# DEFAULT DATABASE: H2 (file-based, zero setup required)
# Data persists in ./data/skillsphere.mv.db between restarts.
# To use MySQL instead, run with: --spring.profiles.active=mysql
# (see application-mysql.properties) after creating a database
# named "skillsphere".
# =========================================================
spring.datasource.url=jdbc:h2:file:./data/skillsphere;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console for quick inspection: http://localhost:8080/h2-console
# JDBC URL to use in the console: jdbc:h2:file:./data/skillsphere
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================
# JWT
# =========================================================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# =========================================================
# CORS - frontend dev server
# =========================================================
app.cors.allowed-origins=http://localhost:5173,https://green-meadow-040644a00.5.azurestaticapps.net

# =========================================================
# Seed data (demo admin + employees) - set to false to disable
# =========================================================
app.seed.enabled=true
