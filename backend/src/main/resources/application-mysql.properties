# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# or: java -jar app.jar --spring.profiles.active=mysql
# Create the database first:  CREATE DATABASE skillsphere;

spring.datasource.url=jdbc:mysql://localhost:3306/skillsphere?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=changeme

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=false
